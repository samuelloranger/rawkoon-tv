name: Release

# Push a vX.Y.Z tag to publish. The APKs are signed with the key the first RawkoonTV used, so
# installed copies update in place, and attached under the names both updaters look for:
# RawkoonTV-<abi>.apk, RawkoonTV.apk (universal) and a .sha256 next to each.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag is the version.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build, test and sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          # Without the key Gradle would sign with the debug key, which no installed copy accepts.
          test -n "$SIGNING_KEY" || { echo "SIGNING_KEY secret is missing" >&2; exit 1; }
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Verify signatures
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee certs.txt
            ! grep -q "Android Debug" certs.txt || { echo "$apk is signed with the debug key" >&2; exit 1; }
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out
          cp app/build/outputs/apk/release/RawkoonTV*.apk out/
          # Checksums are written from inside the directory so they name the bare file, as the updater expects.
          (cd out && for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done)
          # The title must be the bare tag: the first RawkoonTV reads the release's name as its version.
          gh release create "$TAG" out/* --title "$TAG" --generate-notes --verify-tag
