name: Create release

# Releases are built locally with scripts/release.sh, which can read the MPV and
# decoder extensions without storing a token in this repo. Run this by hand only
# once EXTENSIONS_USERNAME and EXTENSIONS_PASSWORD secrets exist.
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  APK_SHORT_NAME: RawkoonTV.apk
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"
  TAG_NAME: ${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build app
        id: buildapp
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ secrets.EXTENSIONS_USERNAME }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.EXTENSIONS_PASSWORD }}"
        run: |
          ./gradlew clean assembleDefaultRelease
      - name: Verify signatures
        run: |
          echo "Verify APK signatures"
          find app/build/outputs -name '*.apk'
          find app/build/outputs -name '*.apk' -print0 | xargs -0 -n1 ${{env.ANDROID_SDK_ROOT}}/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner verify --verbose --print-certs
      - name: Copy APK to shorter names
        id: apks
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' line; do
              # RawkoonTV-default-release-0.2.9-62-g5c12e03-16-arm64-v8a.apk => RawkoonTV-arm64-v8a.apk (the names the in-app updater looks for)
              short_name="$(echo $line | sed -E 's/-default-release-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[a-fA-F0-9]+-[0-9]+//')"
              echo "$line => $short_name"
              cp "$line" "$short_name"
            done
      - name: Checksums
        run: |
          echo "SHA256 checksums:"
          find app/build/outputs -name '*.apk' -print0 | xargs -0 sha256sum
      - name: Upload mapping files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mapping
          path: |
            app/build/outputs/**/mapping.txt
          compression-level: 6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar

          gh release create "${{ env.TAG_NAME }}" \
            --latest --title "${{ env.TAG_NAME }}" --verify-tag --generate-notes \
            app/build/outputs/apk/**/*.apk
