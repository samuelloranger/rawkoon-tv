name: Setup
description: JDK 21, Android SDK and Gradle cache for RawkoonTV builds.

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: zulu
        java-version: '21'
        cache: gradle
    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: "platform-tools platforms;android-36 build-tools;36.0.0"
